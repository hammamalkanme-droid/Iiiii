<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استوديو شهادات النخبة | Elite Certificate Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="app-header">
  <div class="header-brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="34" height="34">
        <path d="M20 3 L37 20 L20 37 L3 20 Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M20 10 L30 20 L20 30 L10 20 Z" fill="currentColor" opacity="0.85"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>استوديو شهادات النخبة</h1>
      <p>إصدار شهادات التكريم والتميّز — Elite Certificate Studio</p>
    </div>
  </div>
  <button id="btnNew" class="btn btn-gold" type="button">＋ شهادة جديدة</button>
</header>

<main class="studio">

  <!-- ===================== CONTROL PANEL ===================== -->
  <aside class="panel" id="panel">

    <section class="card">
      <h2 class="card-title"><span class="card-ico">◈</span> البيانات</h2>

      <label class="field">
        <span>اسم المستحق</span>
        <input id="inName" type="text" value="تقوى الغزالي" autocomplete="off">
      </label>

      <label class="field">
        <span>اللقب</span>
        <select id="inTitle">
          <option value="tharwa" selected>ذُروة النخبة</option>
          <option value="himma">هِمّة النخبة</option>
          <option value="ulfa">أُلفة النخبة</option>
          <option value="umda">عُمدة النخبة</option>
          <option value="sadad">سَداد النخبة</option>
          <option value="baseera">بَصيرة النخبة</option>
        </select>
      </label>

      <div class="field-row">
        <label class="field">
          <span>الشهر</span>
          <select id="inMonth"></select>
        </label>
        <label class="field">
          <span>السنة</span>
          <input id="inYear" type="number" value="2026" min="2020" max="2100">
        </label>
      </div>

      <label class="field">
        <span>نص التكريم</span>
        <textarea id="inText" rows="3">تقديرًا لتميّزها وإسهامها الفاعل، وما قدمته من جهدٍ تجاوز المهام الموكلة إليها، وأسهم في دفع العمل قدمًا خلال شهر أغسطس 2026.</textarea>
      </label>

      <div class="field">
        <span>رقم الشهادة</span>
        <div class="certno-row">
          <input id="inCertNo" type="text" readonly dir="ltr">
          <button id="btnCertNo" class="btn btn-ghost" type="button" title="توليد رقم جديد">توليد رقم جديد</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title"><span class="card-ico">⬡</span> الهوية</h2>

      <div class="upload-box">
        <span class="upload-label">شعار الفريق</span>
        <div class="upload-row">
          <label class="btn btn-ghost file-btn">رفع ملف
            <input id="inLogo" type="file" accept="image/png,image/jpeg,image/svg+xml" hidden>
          </label>
          <span id="logoName" class="file-name">الشعار الافتراضي</span>
        </div>
        <div id="logoThumb" class="thumb"></div>
      </div>

      <div class="upload-box">
        <span class="upload-label">توقيع رئيس الفريق</span>
        <div class="upload-row">
          <label class="btn btn-ghost file-btn">رفع ملف
            <input id="inSig" type="file" accept="image/png,image/jpeg" hidden>
          </label>
          <span id="sigName" class="file-name">توقيع افتراضي</span>
        </div>
        <label class="check">
          <input id="inSigRemoveBg" type="checkbox" checked>
          <span>إزالة الخلفية البيضاء من التوقيع</span>
        </label>
        <div id="sigThumb" class="thumb"></div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title"><span class="card-ico">✦</span> التخصيص</h2>

      <label class="field slider-field">
        <span>حجم اسم المستحق <b id="vNameSize"></b></span>
        <input id="inNameSize" type="range" min="70" max="170" value="120">
      </label>

      <label class="field slider-field">
        <span>حجم نص التكريم <b id="vTextSize"></b></span>
        <input id="inTextSize" type="range" min="26" max="58" value="40">
      </label>

      <label class="field">
        <span>موضع الشعار</span>
        <select id="inLogoPos">
          <option value="auto" selected>حسب تصميم اللقب</option>
          <option value="top-center">أعلى الشهادة</option>
          <option value="top-right">أعلى اليمين</option>
          <option value="top-left">أعلى اليسار</option>
          <option value="footer">التذييل (يسار)</option>
        </select>
      </label>

      <label class="field slider-field">
        <span>حجم الشعار <b id="vLogoSize"></b></span>
        <input id="inLogoSize" type="range" min="60" max="170" value="100">
      </label>

      <label class="field slider-field">
        <span>حجم التوقيع <b id="vSigSize"></b></span>
        <input id="inSigSize" type="range" min="60" max="190" value="100">
      </label>

      <label class="field slider-field">
        <span>تحريك التوقيع أفقيًا <b id="vSigX"></b></span>
        <input id="inSigX" type="range" min="-120" max="120" value="0">
      </label>

      <label class="field slider-field">
        <span>تحريك التوقيع رأسيًا <b id="vSigY"></b></span>
        <input id="inSigY" type="range" min="-70" max="70" value="0">
      </label>
    </section>

    <section class="card">
      <h2 class="card-title"><span class="card-ico">⬇</span> التصدير</h2>
      <button id="btnExport" class="btn btn-gold btn-block" type="button">تصدير الشهادة PNG عالي الجودة</button>
      <p class="hint">دقة التصدير: 3200 × 2000 بكسل — تتم المعالجة محليًا داخل متصفحك.</p>
      <button id="btnReset" class="btn btn-ghost btn-block" type="button">إعادة ضبط</button>
    </section>

  </aside>

  <!-- ===================== LIVE PREVIEW ===================== -->
  <section class="preview-wrap">
    <div class="preview-toolbar">
      <span class="pv-title">معاينة مباشرة</span>
      <span class="pv-badge" id="pvTheme">ذُروة النخبة</span>
    </div>
    <div class="preview-stage" id="stage">
      <canvas id="preview" width="1600" height="1000"></canvas>
    </div>
  </section>

</main>

<script src="js/themes.js"></script>
<script src="js/cert.js"></script>
<script src="js/app.js"></script>
</body>
</html>
